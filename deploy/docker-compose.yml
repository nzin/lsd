# lsd demo: 1 server + 2 agents (+ traffic generators so the topology has something to show).
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   open http://localhost:8090
#
# Containers share the Docker host's kernel, but each agent runs in its own network namespace and
# cgroup, so flows are captured per container (TC eBPF on its eth0) and CPU/memory come from the
# container's own cgroup (--metrics-scope cgroup).
name: lsd

x-agent: &agent
  image: lsd:dev
  pull_policy: never   # built locally by the server service, never pulled
  restart: unless-stopped
  depends_on:
    server:
      condition: service_healthy
  cap_add: [BPF, NET_ADMIN, PERFMON, SYS_RESOURCE]
  ulimits:
    memlock: { soft: -1, hard: -1 }

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lsd:dev
    hostname: server
    command: ["server", "--data-dir", "/data"]
    # The server monitors itself too (like an agent): these let it capture its own eBPF traffic.
    cap_add: [BPF, NET_ADMIN, PERFMON, SYS_RESOURCE]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "8090:8090"      # web UI + API
    volumes:
      - lsd-data:/data
    healthcheck:
      test: ["CMD", "/lsd", "healthcheck", "--url", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  agent-1:
    <<: *agent
    hostname: agent-1
    command: ["agent", "--server", "server:7070", "--node-id", "agent-1", "--metrics-scope", "cgroup"]

  agent-2:
    <<: *agent
    hostname: agent-2
    command: ["agent", "--server", "server:7070", "--node-id", "agent-2", "--metrics-scope", "cgroup"]

  # Traffic generators live in the agents' network namespaces so the agents' eBPF programs see the traffic.
  # A loadgen *downloads* from its peer, so bytes flow peer -> loadgen:
  #   agent-1 -> agent-2: ~4 MB/s on a slow sine wave (thick edge)   [loadgen-2 pulls from agent-1]
  #   agent-2 -> agent-1: ~400 KB/s steady (thin edge)               [loadgen-1 pulls from agent-2]
  # loadgen-2 also polls the server's API every second (small agent-2 <-> server edge).
  loadgen-1:
    image: lsd:dev
    pull_policy: never
    network_mode: "service:agent-1"
    depends_on: [agent-1, agent-2]
    restart: unless-stopped
    command: ["loadgen", "--listen", ":9000", "--peer", "http://agent-2:9000", "--rate", "400KB/s", "--pattern", "steady"]

  loadgen-2:
    image: lsd:dev
    pull_policy: never
    network_mode: "service:agent-2"
    depends_on: [agent-1, agent-2]
    restart: unless-stopped
    command: ["loadgen", "--listen", ":9000", "--peer", "http://agent-1:9000", "--rate", "4MB/s", "--pattern", "sine", "--period", "90s",
              "--ping", "http://server:8090/api/nodes", "--ping-interval", "1s"]

volumes:
  lsd-data:

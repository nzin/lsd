name: Packages

# Builds the Debian packages (lsd-server and lsd-agent, for amd64 and arm64).
#
#   - push a tag like v1.2.3 (or v1.2.3-rc1)  ->  test, build, and publish a GitHub release with the .deb files
#   - pull request / manual run               ->  test and build only; the .deb files are kept as workflow artifacts
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI (it is embedded into the Go binary)
        run: make web

      - name: Go vet
        run: go vet ./... && go vet -tags bpftest,containertest ./...

      - name: Go tests
        run: go test -race ./...

      - name: Web tests
        run: npm test
        working-directory: web

  build:
    name: Packages (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64] # cross-compiled: the binary is static (CGO_ENABLED=0), no ARM runner needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Work out the package version
        id: version
        run: echo "version=$(.github/scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build lsd-server and lsd-agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: make deb DEB_ARCH="$ARCH" VERSION="$VERSION"

      - name: Check the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: .github/scripts/verify-debs.sh dist "$VERSION" "$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v4

      - name: Work out the package version
        id: version
        run: echo "version=$(.github/scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: dist

      - name: Checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum -- *.deb > SHA256SUMS
          cat SHA256SUMS
          cat > ../release-notes.md <<'EOF'
          ## Install

          Debian and Ubuntu, on `amd64` or `arm64` (use the matching file):

              sudo apt install ./lsd-server_@VERSION@_amd64.deb   # the machine that hosts the web UI
              sudo apt install ./lsd-agent_@VERSION@_amd64.deb    # every machine to monitor

          Then set `LSD_SERVER` in `/etc/lsd/agent.env` to `<server>:7070` and run `sudo systemctl restart lsd-agent`.
          The installation guide (also available offline with `lsd get-documentation`) covers the configuration.

          Check the downloads with `sha256sum -c SHA256SUMS`.
          EOF
          sed -i "s/@VERSION@/${VERSION}/g" ../release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/SHA256SUMS
